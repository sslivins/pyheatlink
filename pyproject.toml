[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyheatlink"
version = "0.1.0"
description = "Async Python client for HeatLink, the local controller for Mitsubishi mini-split heads"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Stefan Slivinski", email = "sslivins@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
    "Framework :: AsyncIO",
    "Typing :: Typed"
]
dependencies = [
    "aiohttp>=3.9.0"
]

[project.optional-dependencies]
tests = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0"
]

[project.urls]
"Homepage" = "https://github.com/sslivins/pyheatlink"
"Bug Tracker" = "https://github.com/sslivins/pyheatlink/issues"
"Firmware" = "https://github.com/sslivins/heatlink"

[project.scripts]
pyheatlink = "pyheatlink.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyheatlink = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
